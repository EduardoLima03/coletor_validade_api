services:
  app:
    build: .
    image: datacheck:1.0
    container_name: datacheck-app
    restart: unless-stopped
    ports:
      - "9001:80"
    environment:
      APP_ENV: production
      APP_DEBUG: false
      APP_URL: http://localhost:9001
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: datacheck
      DB_USERNAME: datacheck
      DB_PASSWORD: senha_forte
    depends_on:
      db:
        condition: service_healthy
    networks:
      - datacheck-net

  db:
    image: mysql:8.0
    container_name: datacheck-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: datacheck
      MYSQL_USER: datacheck
      MYSQL_PASSWORD: senha_forte
      MYSQL_ROOT_PASSWORD: senha_root_forte
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-udatacheck", "-psenha_forte"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - datacheck-net

volumes:
  mysql_data:

networks:
  datacheck-net:
    driver: bridge
