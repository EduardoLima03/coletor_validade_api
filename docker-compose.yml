services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: datacheck-app

    ports:
      - "9001:80"

    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=laravel
      - DB_USERNAME=root
      - DB_PASSWORD=laravel

    depends_on:
      db:
        condition: service_healthy

    networks:
      - datacheck-net

  db:
    image: mysql:8.0
    container_name: datacheck-db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: laravel
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-plaravel"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - datacheck-net

volumes:
  mysql_data:

networks:
  datacheck-net:
    driver: bridge
